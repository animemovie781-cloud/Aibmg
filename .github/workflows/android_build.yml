name: Build CineVerse APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper # Falls back to wrapper if exists, otherwise specify a version if needed

      - name: Build with Gradle
        # Using 'gradle' command directly as the wrapper might be missing in some environments
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CineVerse-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
